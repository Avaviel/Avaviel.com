<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Little • Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap');
        :root {
            --bg: #0a0a0a;
            --text: #f5f5f5;
            --accent: #3b82f6;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 700px;
            padding: 40px 20px;
        }
        h1 {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 5.5rem;
            font-weight: 600;
            margin: 0 0 20px 0;
            letter-spacing: -3px;
            line-height: 1;
        }
        .subtitle {
            font-size: 1.8rem;
            color: #888;
            margin: 0 0 80px 0;
            font-weight: 400;
        }
        .contact-section {
            margin: 60px 0;
        }
        .links-section {
            margin: 60px 0 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .label {
            font-size: 1.1rem;
            color: #777;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .email {
            font-size: 2.8rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .email:hover {
            color: #60a5fa;
        }
        .small-link {
            font-size: 1.1rem;
            color: #888;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
            transition: all 0.2s ease;
        }
        .small-link:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .affiliate-note {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.5;
            max-width: 480px;
        }
        .footer {
            margin-top: 100px;
            font-size: 0.95rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Paul Little III</h1>
        <p class="subtitle">Portfolio & Contact</p>

        <div class="contact-section">
            <div class="label">Email</div>
            <a href="mailto:avaviel@gmail.com" class="email">avaviel@gmail.com</a>
        </div>

        <div class="links-section">
            <a href="https://youtube.com/@avaviel" class="small-link" target="_blank" rel="noopener">YouTube</a>
            <a href="https://go.avaviel.com/yaoguang" class="small-link">Yao Guang Power Bank</a>
            <a href="https://go.avaviel.com/hsr" class="small-link">Star Rail Hub</a>
            <p class="affiliate-note">
                (Affiliate Links)<br>
                *Note: I receive a small commission from purchases made through this link at no extra cost to you.
            </p>
        </div>

        <div class="footer">
            © 2026 • Available for freelance & collaboration.
        </div>
    </div>
</body>
</html>
